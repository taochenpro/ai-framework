  developer: .agents/agents/developer-agent.md
  code_review: .agents/agents/code-review-agent.md
  test_engineer: .agents/agents/test-engineer-agent.md
  devops: .agents/agents/devops-agent.md
  project_coordinator: .agents/agents/project-coordinator-agent.md


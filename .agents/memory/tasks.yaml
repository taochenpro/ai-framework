version: 1
updated_at: null

task_schema:
  id: "Stable task ID, for example T-0001."
  title: "Short action-oriented title."
  status: "proposed | ready | in_progress | blocked | review | done"
  owner: "Exactly one owning agent while active."
  agents: "Supporting agents involved."
  priority: "low | medium | high | critical"
  files: "Expected files or domains touched."
  dependencies: "Task IDs that must complete first."
  acceptance_criteria: "Observable conditions required for done."
  notes: "Important context, blockers, or handoff details."

tasks:
  - id: T-0001
    title: Initialize project backlog
    status: proposed
    owner: project-coordinator-agent
    agents:
      - product-requirements-agent
    priority: medium
    files:
      - .agents/docs/requirements.md
      - .agents/memory/tasks.yaml
    dependencies: []
    acceptance_criteria:
      - Initial product goals are captured in .agents/docs/requirements.md.
      - First implementation tasks have clear acceptance criteria.
    notes: Replace or close this starter task when a concrete project begins.

version: 2
project_name: codex-projects-framework

runtime_principle: "Load one task packet, one primary agent, and only listed context."

agents:
  coordinator: agents/coordinator.md
  planner: agents/planner.md
  builder: agents/builder.md
  reviewer: agents/reviewer.md
  devops: agents/devops.md

workflows:
  task_flow: workflows/task-flow.md
  review_flow: workflows/review-flow.md

memory:
  tasks: memory/tasks.yaml
  task_packets: memory/task-packets
  events: memory/events.md
  locks: memory/locks.yaml
  decisions: memory/decisions

quality_gates:
  require_task_packet_for_ready: true
  require_one_primary_agent: true
  require_allowed_files: true
  require_tests_for_src_changes: true
  require_review_before_done: true
